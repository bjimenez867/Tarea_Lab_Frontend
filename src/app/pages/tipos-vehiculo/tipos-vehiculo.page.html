<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Tipos de vehículo</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="abrirNuevo()">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-list *ngIf="!cargando">
    <ion-item-sliding *ngFor="let tipo of tipos">
      <ion-item>
        <ion-label>
          <h2>{{ tipo.descripcion }}</h2>
        </ion-label>
        <ion-badge [color]="tipo.activo ? 'success' : 'medium'" slot="end">
          {{ tipo.activo ? 'Activo' : 'Inactivo' }}
        </ion-badge>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="primary" (click)="abrirEditar(tipo)">
          <ion-icon name="create-outline"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="eliminar(tipo)">
          <ion-icon name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    <ion-item *ngIf="tipos.length === 0">
      <ion-label class="ion-text-center">No hay tipos de vehículo registrados</ion-label>
    </ion-item>
  </ion-list>

  <ion-modal [isOpen]="mostrarFormulario" (didDismiss)="cerrarFormulario()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>{{ modoEdicion ? 'Editar tipo' : 'Nuevo tipo de vehículo' }}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrarFormulario()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <form [formGroup]="tipoForm" (ngSubmit)="guardar()">
          <ion-item>
            <ion-label position="floating">Descripción</ion-label>
            <ion-input formControlName="descripcion"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label>Activo</ion-label>
            <ion-toggle formControlName="activo" slot="end"></ion-toggle>
          </ion-item>

          <ion-button expand="block" type="submit" class="ion-margin-top">
            Guardar
          </ion-button>
        </form>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
