<ion-content class="ion-padding">
  <div class="login-container">
    <div class="login-card">
      <h1>Sistema de Parqueos</h1>
      <p>Iniciá sesión para continuar</p>

      <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
        <ion-item>
          <ion-label position="floating">Usuario</ion-label>
          <ion-input formControlName="usuario" type="text"></ion-input>
        </ion-item>
        <ion-text color="danger" *ngIf="loginForm.get('usuario')?.touched && loginForm.get('usuario')?.invalid">
          <small>El usuario es obligatorio</small>
        </ion-text>

        <ion-item>
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input formControlName="password" type="password"></ion-input>
        </ion-item>
        <ion-text color="danger" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <small>La contraseña debe tener al menos 4 caracteres</small>
        </ion-text>

        <ion-button expand="block" type="submit" class="ion-margin-top">
          Iniciar sesión
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
